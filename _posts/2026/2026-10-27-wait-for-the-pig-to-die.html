        <h1>等猪死</h1>
        <p>民间俗语“等鱼死”，耐心等待，鱼死了，价格就低了。等猪死是猪当道，猪不死，道不生。猪已当道很久了，还在道上赖着，看着让人痛心疾首，却又无可奈何。那猪妥妥的一个沽名钓誉之徒，毫无作为的庸碌之辈。众生需耐心的韬光养晦，休养生息，待猪死道生。</p>
        <p>未来如何？不可知，或许应抱有希望。</p>
